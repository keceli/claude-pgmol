[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgmol"
version = "0.1.0"
description = "Determine the Schoenflies point group of a molecule from an XYZ geometry"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "PGMol contributors" }]
keywords = ["chemistry", "symmetry", "point group", "Schoenflies", "xyz"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
]

[project.scripts]
pgmol = "pgmol.cli:main"

[project.urls]
Homepage = "https://github.com/example/pgmol"
Source = "https://github.com/example/pgmol"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pgmol = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["pgmol"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 95
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test helpers are imported as top-level modules via conftest's sys.path entry.
"tests/*" = ["E501", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["pgmol", "conftest", "reference_groups"]
