name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Allow one deployment at a time; never cancel one midway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the wheel the page will run
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site
          cp web/index.html web/app.js web/worker.js site/
          cp -r core_xyz challenge_xyz site/
          cp dist/pgmol-*.whl site/
          # Sanitised HTML replays only -- the raw session transcripts stay
          # in the repository and are never published.
          mkdir -p site/traces
          for dir in agent-traces/*/; do
            slug="$(basename "$dir")"
            [ -f "$dir/replay.html" ] && cp "$dir/replay.html" "site/traces/$slug.html"
          done
          python - <<'PY'
          import json, pathlib, os

          site = pathlib.Path("site")
          wheel = next(site.glob("pgmol-*.whl")).name
          version = wheel.split("-")[1]
          commit = os.environ["GITHUB_SHA"][:7]
          (site / "build.json").write_text(
              json.dumps({"version": version, "commit": commit, "wheel": wheel}, indent=2)
          )

          # The picker lists the real test fixtures. Each file name ends in the
          # Schoenflies label its contents must produce, which the page shows as
          # a separate cross-check -- never as the answer.
          groups = []
          for directory, label in (("core_xyz", "Core fixtures"),
                                   ("challenge_xyz", "Challenge fixtures")):
              items = []
              for path in sorted((site / directory).glob("*.xyz")):
                  name, _, expected = path.stem.rpartition("_")
                  items.append({"path": f"{directory}/{path.name}",
                                "name": name, "expected": expected})
              groups.append({"label": f"{label} ({len(items)})", "items": items})
          (site / "examples.json").write_text(json.dumps(groups, indent=2))

          # An index for the session replays.
          traces = sorted((site / "traces").glob("*.html")) if (site / "traces").is_dir() else []
          rows = "".join(
              f'<li><a href="{t.name}">{t.stem}</a></li>' for t in traces
          )
          (site / "traces" / "index.html").write_text(
              "<!doctype html><meta charset=utf-8>"
              "<title>pgmol — session replays</title>"
              "<meta name=viewport content='width=device-width,initial-scale=1'>"
              "<style>body{font:16px/1.6 system-ui,sans-serif;max-width:46rem;margin:3rem auto;"
              "padding:0 1rem;color:#1b1f24;background:#fff}"
              "@media(prefers-color-scheme:dark){body{color:#e6edf3;background:#0d1117}}"
              "a{color:#1f6feb}@media(prefers-color-scheme:dark){a{color:#4493f8}}"
              "li{margin:.4rem 0;font-family:ui-monospace,monospace}</style>"
              "<h1>Session replays</h1>"
              "<p>Interactive replays of the AI coding sessions that built "
              "<a href='../'>pgmol</a>. Each page is self-contained and makes no "
              "external requests.</p>"
              f"<ul>{rows or '<li>none yet</li>'}</ul>"
              "<p><a href='../'>&larr; back to pgmol</a></p>"
          ) if traces else None
          print(f"{wheel}  @{commit}  "
                f"{sum(len(g['items']) for g in groups)} examples  "
                f"{len(traces)} replay(s)")
          PY

      - name: Check the site is complete
        run: |
          set -euo pipefail
          test -s site/traces/index.html || { echo "::error::replay index missing"; exit 1; }
          for f in index.html app.js worker.js build.json examples.json; do
            test -s "site/$f" || { echo "::error::site/$f missing or empty"; exit 1; }
          done
          test -n "$(ls site/pgmol-*.whl)" || { echo "::error::wheel missing"; exit 1; }
          if ls site/*.jsonl site/traces/*.jsonl >/dev/null 2>&1; then
            echo "::error::a raw transcript reached the published site"; exit 1
          fi
          python -c "
          import json, pathlib
          site = pathlib.Path('site')
          build = json.loads((site / 'build.json').read_text())
          assert (site / build['wheel']).is_file(), 'build.json names a missing wheel'
          groups = json.loads((site / 'examples.json').read_text())
          total = 0
          for group in groups:
              for item in group['items']:
                  assert (site / item['path']).is_file(), item['path']
                  total += 1
          assert total == 91, f'expected 91 fixtures, found {total}'
          print('site OK:', build, total, 'examples')
          "

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
