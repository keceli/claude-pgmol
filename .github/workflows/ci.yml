name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package from a clean environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Show resolved versions
        run: python -m pip freeze

      - name: Run the test suite with coverage
        run: >
          python -m pytest
          --cov=pgmol
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  acceptance:
    name: Acceptance fixtures via the installed CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the built wheel, not the source tree
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install dist/*.whl

      - name: Every fixture must match its file name
        run: |
          set -euo pipefail
          failures=0
          for file in core_xyz/*.xyz; do
            expected="${file##*_}"; expected="${expected%.xyz}"
            actual="$(pgmol "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$file::expected $expected, got $actual"
              failures=$((failures + 1))
            fi
          done
          echo "checked $(ls core_xyz/*.xyz | wc -l) fixtures, $failures failed"
          test "$failures" -eq 0

      - name: Invalid input must exit nonzero
        run: |
          set -euo pipefail
          printf '5\ntruncated\nH 0 0 0\n' > broken.xyz
          if pgmol broken.xyz; then
            echo "::error::malformed input was accepted"
            exit 1
          fi

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format
        run: ruff format --check src tests
      - name: mypy
        run: mypy --strict src/pgmol
